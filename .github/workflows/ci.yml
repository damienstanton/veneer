name: CI

# Cost controls: skip draft PRs (run by hand from the Actions tab with
# workflow_dispatch), cancel a superseded run on a PR (never on main, where
# release-please waits on this workflow), and save the Rust cache only from
# main. Not path-filtered on purpose: the Release workflow keys off this one
# finishing on main, so a skipped run would stall the release PR.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verifier
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Test
        run: cargo make test

      - name: Self-check (harness obeys its own laws)
        run: cargo make self-check
